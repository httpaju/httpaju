<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Applications Blog</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1>Welcome to AJ Applications Blog</h1>

    <div id="latest-posts"></div> <!-- Container for posts -->

  

    <script>
        // Fetch posts from API and display them
        async function loadPosts() {
            try {
                const response = await fetch('/api/posts'); // Fetch posts from API
                const posts = await response.json(); // Convert response to JSON

                const postsContainer = document.getElementById('latest-posts');

                if (posts.length === 0) {
                    postsContainer.innerHTML = '<p>No posts available.</p>';
                } else {
                    posts.forEach(post => {
                        const postElement = document.createElement('div');
                        postElement.classList.add('post');
                        
                        postElement.innerHTML = `
                            <h2>${post.title}</h2>
                            <p>${post.content.substring(0, 200)}...</p>
                            <a href="/post/${post._id}">Read More</a>
                        `;
                        
                        postsContainer.appendChild(postElement);
                    });
                }
            } catch (err) {
                console.error('Error fetching posts:', err);
                document.getElementById('latest-posts').innerHTML = '<p>Error loading posts.</p>';
            }
        }

        // Call the function to load posts when the page loads
        window.onload = loadPosts;
    </script>
</body>
</html>
