<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Applications Blog</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1>Welcome to AJ Applications Blog</h1>

    <div id="posts">
        <!-- Posts will be displayed here -->
    </div>

    <script>
        // Fetch posts from backend
        fetch('/posts')
            .then(response => response.json())
            .then(posts => {
                const postContainer = document.getElementById('posts');
                
                if (posts.length === 0) {
                    postContainer.innerHTML = '<p>No posts available.</p>';
                } else {
                    posts.forEach(post => {
                        const postHtml = `
                            <div class="post">
                                <h2>${post.title}</h2>
                                ${post.imageUrl ? `<img src="${post.imageUrl}" alt="${post.title}" class="post-image" />` : ''}
                                <p>${post.content.substring(0, 200)}...</p>
                                <a href="/post/${post._id}">Read More</a>
                            </div>
                        `;
                        postContainer.innerHTML += postHtml;
                    });
                }
            })
            .catch(error => {
                console.error('Error fetching posts:', error);
                document.getElementById('posts').innerHTML = '<p>Error loading posts.</p>';
            });
    </script>
</body>
</html>
